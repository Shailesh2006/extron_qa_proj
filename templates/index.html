<!DOCTYPE html>
<html>
<head>
    <title>Extron QA Chat</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        #chat { border: 1px solid #ccc; padding: 20px; height: 400px; overflow-y: scroll; }
        .user { color: blue; margin-bottom: 10px; }
        .bot { color: green; margin-bottom: 10px; }
        #inputBox { width: 80%; padding: 10px; }
        #sendBtn { padding: 10px 20px; }
    </style>
</head>
<body>

<h2>Extron Product QA (Local)</h2>

<div id="chat"></div>

<br>

<input id="inputBox" placeholder="Ask a question about Extron products...">
<button id="sendBtn">Send</button>

<script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("inputBox");
    const sendBtn = document.getElementById("sendBtn");

    function addMessage(text, cls) {
        const div = document.createElement("div");
        div.className = cls;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    sendBtn.onclick = async () => {
        const query = input.value;
        if (!query) return;

        addMessage("You: " + query, "user");
        input.value = "";

        const response = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query })
        });

        const data = await response.json();
        addMessage("Bot: " + data.answer, "bot");
    };
</script>

</body>
</html>
